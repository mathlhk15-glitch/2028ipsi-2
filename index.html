function getData(){
  return [...document.querySelectorAll('.univ-card')].map((card,i)=>({
    num:i+1,
    name:card.querySelector('.name-input').value,
    sections:[...card.querySelectorAll('.section-item')].map(si=>({
      label:si.querySelector('.lbl-input').value,
      type:si.querySelector('select').value,
      items:[...si.querySelectorAll('.item-input')].map(ii=>ii.value).filter(v=>v.trim())
    }))
  }));
}

function renderAll(){
  const list=document.getElementById('univList');
  list.innerHTML='';
  universities.forEach(u=>renderCard(u));
}

function renderCard(u){
  const list=document.getElementById('univList');
  const div=document.createElement('div');
  div.className='univ-card';
  const secsHTML=u.sections.map(s=>`
    <div class="section-item">
      <div class="section-row">
        <input class="lbl-input" value="${s.label}" placeholder="라벨명" style="width:100px">
        <select>${labelTypes.map(t=>`<option value="${t.val}"${t.val===s.type?' selected':''}>${t.label}</option>`).join('')}</select>
        <button class="sec-del" onclick="delSection(this)"><i class="ti ti-trash" aria-hidden="true"></i> 삭제</button>
      </div>
      <div class="items-wrap">${s.items.map(it=>`<div class="item-row"><input class="item-input" value="${it}" placeholder="내용 입력"><button onclick="delItem(this)">삭제</button></div>`).join('')}</div>
      <button class="small-btn" onclick="addItem(this)"><i class="ti ti-plus" aria-hidden="true"></i> 항목 추가</button>
    </div>`).join('');
  div.innerHTML=`
    <div class="univ-card-header" onclick="toggleCard(this)">
      <span class="num">${u.num}</span>
      <span class="uname">${u.name}</span>
      <div class="actions">
        <button onclick="moveUp(event,this)"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>
        <button onclick="moveDown(event,this)"><i class="ti ti-arrow-down" aria-hidden="true"></i></button>
        <button class="del" onclick="delUniv(event,this)"><i class="ti ti-trash" aria-hidden="true"></i> 삭제</button>
      </div>
      <i class="ti ti-chevron-right chevron" aria-hidden="true"></i>
    </div>
    <div class="univ-card-body">
      <div class="field-row"><label>대학명</label><input class="name-input" value="${u.name}" placeholder="대학명 입력"></div>
      <div class="sections-wrap">${secsHTML}</div>
      <button class="small-btn" onclick="addSection(this)"><i class="ti ti-plus" aria-hidden="true"></i> 섹션 추가</button>
    </div>`;
  list.appendChild(div);
}

function toggleCard(header){
  const body=header.nextElementSibling;
  const chev=header.querySelector('.chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
  if(body.classList.contains('open')){
    const uname=header.querySelector('.uname');
    body.querySelector('.name-input').addEventListener('input',e=>uname.textContent=e.target.value);
  }
}
function addItem(btn){
  const wrap=btn.previousElementSibling;
  const row=document.createElement('div');
  row.className='item-row';
  row.innerHTML=`<input class="item-input" placeholder="내용 입력"><button onclick="delItem(this)">삭제</button>`;
  wrap.appendChild(row);
}
function delItem(btn){btn.closest('.item-row').remove()}
function delSection(btn){btn.closest('.section-item').remove()}
function addSection(btn){
  const wrap=btn.previousElementSibling;
  const div=document.createElement('div');
  div.className='section-item';
  div.innerHTML=`
    <div class="section-row">
      <input class="lbl-input" value="수시" placeholder="라벨명" style="width:100px">
      <select>${labelTypes.map(t=>`<option value="${t.val}">${t.label}</option>`).join('')}</select>
      <button class="sec-del" onclick="delSection(this)"><i class="ti ti-trash" aria-hidden="true"></i> 삭제</button>
    </div>
    <div class="items-wrap"><div class="item-row"><input class="item-input" placeholder="내용 입력"><button onclick="delItem(this)">삭제</button></div></div>
    <button class="small-btn" onclick="addItem(this)"><i class="ti ti-plus" aria-hidden="true"></i> 항목 추가</button>`;
  wrap.appendChild(div);
}
function addUniv(){
  universities=getData();
  universities.push({num:universities.length+1,name:"새 대학교",sections:[{label:"수시",type:"label-susi",items:["내용 입력"]}]});
  renderAll();

function delUniv(e,btn){e.stopPropagation();btn.closest('.univ-card').remove();renumber()}
function moveUp(e,btn){e.stopPropagation();const c=btn.closest('.univ-card'),p=c.previousElementSibling;if(p){c.parentNode.insertBefore(c,p);renumber()}}
function moveDown(e,btn){e.stopPropagation();const c=btn.closest('.univ-card'),n=c.nextElementSibling;if(n){c.parentNode.insertBefore(n,c);renumber()}}
function renumber(){document.querySelectorAll('.univ-card').forEach((c,i)=>c.querySelector('.num').textContent=i+1)}

function exportPDF(){
  const data = getData();
  const html = buildExportHTML(data, 'pdf');
  const w = window.open('', '_blank', 'width=1400,height=900');
  if (!w) { alert('팝업이 차단되었습니다. 팝업 허용 후 다시 시도하세요.'); return; }
  w.document.write(html);
  w.document.close();
}

function exportHTML(){
  const data = getData();
  const count = data.filter(u => u.sections.filter(s => s.items.length > 0).length > 0).length;
  const html = buildExportHTML(data, 'html');
  const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '2028 ' + count + '개 대학 핵심 변화 한눈에 보기(상근-뀨).html';
  a.click();
}
// ── 저장 / 불러오기 ──────────────────────────────────────────
const STORAGE_KEY = 'univ2028_data_v6';

function setStatus(msg, color){
  const el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.style.background = color === 'ok' ? '#e8f5e9' : color === 'err' ? '#fce4ec' : '#fff8e1';
  el.style.color = color === 'ok' ? '#2e7d32' : color === 'err' ? '#c62828' : '#e65100';
  if(color !== 'loading') setTimeout(()=>{ el.textContent=''; el.style.background=''; }, 3000);
}

function saveData(){
  try {
    const data = getData();
    setStatus('저장 중…', 'loading');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setStatus('✅ 저장 완료 (' + data.length + '개 대학)', 'ok');
  } catch(e) {
    setStatus('❌ 오류: ' + e.message, 'err');
  }
}

function loadData(){
  try {
    setStatus('불러오는 중…', 'loading');
    const val = localStorage.getItem(STORAGE_KEY);
    if(val){
      universities = JSON.parse(val);
      renderAll();
      setStatus('✅ 불러오기 완료 (' + universities.length + '개 대학)', 'ok');
    } else {
      setStatus('저장된 데이터가 없습니다', 'warn');
    }
  } catch(e) {
    setStatus('저장된 데이터 없음 (기본값 사용)', 'warn');
  }
}

function autoLoad(){
  try {
    const val = localStorage.getItem(STORAGE_KEY);
    if(val){
      universities = JSON.parse(val);
      renderAll();
      setStatus('✅ 자동 복원 완료', 'ok');
    } else {
      renderAll();
    }
  } catch(e) {
    renderAll();
  }
}

// Ctrl+S 단축키 저장
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 's'){ e.preventDefault(); saveData(); }
});

renderAll();
